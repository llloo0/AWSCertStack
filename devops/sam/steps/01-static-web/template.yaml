AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CertStack step 01 - static site (S3 + CloudFront)

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  Stage:
    Type: String
    Default: 01-static-web
    Description: Deployment stage, written into the frontend config

Resources:
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: Project, Value: CertStack }
        - { Key: Env, Value: !Ref Env }
        - { Key: Stage, Value: !Ref Stage }

  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub certstack-${Env}-web-oac
        Description: OAC for the CertStack web bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub certstack-${Env}-${Stage}
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200

        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Select [1, !Split ['://', !GetAtt HttpApi.ApiEndpoint]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]

        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD

        CacheBehaviors:
          - PathPattern: /config.json
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            Compress: false
          - PathPattern: /content/index.json
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: true
          - PathPattern: /content/*
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
            Compress: true
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal: 
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${WebBucket}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub certstack-${Env}-common
      ContentUri: app/lambda/common/python/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub certstack-${Env}
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
  
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub certstack-${Env}
      Description: CertStack API
      Auth:
        Authorizers:
          CognitoAuth:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
  
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub certstack-${Env}-health
      CodeUri: app/lambda/health/
      Handler: app.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 10
      Layers:
        - !Ref CommonLayer
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/health
            Method: GET

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub certstack-${Env}-profile
      CodeUri: app/lambda/profile/
      Handler: app.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/me
            Method: GET
            Auth:
              Authorizer: CognitoAuth
        Stats:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/stats
            Method: GET
            Auth:
              Authorizer: CognitoAuth
        MePatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/me
            Method: PATCH
            Auth:
              Authorizer: CognitoAuth
  
  SessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub certstack-${Env}-sessions
      CodeUri: app/lambda/sessions/
      Handler: app.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 15
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          CONTENT_BUCKET: !Ref WebBucket
          CONTENT_INDEX_KEY: content/index.json
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - S3ReadPolicy:
            BucketName: !Ref WebBucket
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/sessions
            Method: POST
            Auth:
              Authorizer: CognitoAuth
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/sessions
            Method: GET
            Auth:
              Authorizer: CognitoAuth
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: "/api/sessions/{id}"
            Method: GET
            Auth:
              Authorizer: CognitoAuth
        Answer:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: "/api/sessions/{id}/answers/{qid}"
            Method: PUT
            Auth:
              Authorizer: CognitoAuth
        Finish:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: "/api/sessions/{id}/finish"
            Method: POST
            Auth:
              Authorizer: CognitoAuth

  StudyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub certstack-${Env}-study
      CodeUri: app/lambda/study/
      Handler: app.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Due:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/srs/due
            Method: GET
            Auth:
              Authorizer: CognitoAuth
        Bookmarks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/bookmarks
            Method: GET
            Auth:
              Authorizer: CognitoAuth
        UpdateBookmark:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: "/api/bookmarks/{qid}"
            Method: PUT
            Auth:
              Authorizer: CognitoAuth
        DeleteBookmark:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: "/api/bookmarks/{qid}"
            Method: DELETE
            Auth:
              Authorizer: CognitoAuth
  
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub certstack-${Env}
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
      Tags:
        - { Key: Project, Value: CertStack }
        - { Key: Env, Value: !Ref Env }

Outputs:
  WebBucketName:
    Value: !Ref WebBucket
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  ApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
  TableName:
    Value: !Ref Table
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
