AWSTemplateFormatVersion: '2010-09-09'
Description: CertStack step 01 - static site (S3 + CloudFront)

# 这是 Step 01 的起点，不是成品。
# 按 docs/DEVOPS-FROM-ZERO.md 的 Increment 0 开始，一次只加一个资源。
#
# 现在这个模板还不能部署：Resources 是空的。
# 先把 WebBucket 写进来，跑一次 deploy，拿到桶名，再进入 Increment 1。

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

Resources:
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: Project, Value: CertStack }
        - { Key: Env, Value: !Ref Env }


Outputs:
  WebBucketName:
    Value: !Ref WebBucket
