AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CertStack - AWS certification quiz app (S3 + CloudFront + Cognito + HTTP API + Lambda + DynamoDB)

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment name used in resource names

Conditions:
  IsProd: !Equals [!Ref Env, prod]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 15
    Layers:
      - !Ref CommonLayer
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        CONTENT_BUCKET: !Ref ContentBucket
        CONTENT_INDEX_KEY: content/index.json
        ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
        LOG_LEVEL: INFO
    Tags:
      Project: CertStack
      Env: !Ref Env

Resources:
  # ---------------------------------------------------------------- 共享代码层
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub certstack-${Env}-common
      Description: Shared helpers for CertStack Lambda handlers
      ContentUri: app/lambda/common/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12

  # ---------------------------------------------------------------- 数据
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub certstack-${Env}
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
        - { AttributeName: gsi2pk, AttributeType: S }
        - { AttributeName: gsi2sk, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
        - IndexName: gsi2
          KeySchema:
            - { AttributeName: gsi2pk, KeyType: HASH }
            - { AttributeName: gsi2sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: CertStack
        - Key: Env
          Value: !Ref Env

  # ---------------------------------------------------------------- 存储
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: CertStack
        - Key: Env
          Value: !Ref Env

  ContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            ExpiredObjectDeleteMarker: true
      Tags:
        - Key: Project
          Value: CertStack
        - Key: Env
          Value: !Ref Env

  # ---------------------------------------------------------------- 认证
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub certstack-${Env}
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 3
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Project: CertStack
        Env: !Ref Env

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      SupportedIdentityProviders: [COGNITO]

  # ---------------------------------------------------------------- API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub certstack-${Env}
      Description: CertStack quiz API
      Tags:
        Project: CertStack
        Env: !Ref Env
      CorsConfiguration:
        AllowOrigins:
          - http://localhost:5173
          - http://127.0.0.1:5173
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods: ['*']
        MaxAge: 3600
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient

  # ---------------------------------------------------------------- 日志（保留 7 天，控制成本）
  ProfileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/certstack-${Env}-profile
      RetentionInDays: 7

  SessionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/certstack-${Env}-sessions
      RetentionInDays: 7

  StudyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/certstack-${Env}-study
      RetentionInDays: 7

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/certstack-${Env}-health
      RetentionInDays: 7

  ProfileFunction:
    Type: AWS::Serverless::Function
    DependsOn: ProfileLogGroup
    Properties:
      FunctionName: !Sub certstack-${Env}-profile
      Description: User profile, settings and aggregate stats
      CodeUri: app/lambda/profile/
      Handler: app.handler
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        MeGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/me
            Method: GET
        MePatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/me
            Method: PATCH
        Stats:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/stats
            Method: GET

  SessionsFunction:
    Type: AWS::Serverless::Function
    DependsOn: SessionsLogGroup
    Properties:
      FunctionName: !Sub certstack-${Env}-sessions
      Description: Practice sessions, answers and scoring
      CodeUri: app/lambda/sessions/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - S3ReadPolicy:
            BucketName: !Ref ContentBucket
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/sessions
            Method: POST
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/sessions
            Method: GET
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/sessions/{id}
            Method: GET
        Answer:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/sessions/{id}/answers/{qid}
            Method: PUT
        Finish:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/sessions/{id}/finish
            Method: POST

  StudyFunction:
    Type: AWS::Serverless::Function
    DependsOn: StudyLogGroup
    Properties:
      FunctionName: !Sub certstack-${Env}-study
      Description: Spaced repetition queue and bookmarks
      CodeUri: app/lambda/study/
      Handler: app.handler
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - S3ReadPolicy:
            BucketName: !Ref ContentBucket
      Events:
        Due:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/srs/due
            Method: GET
        ListBookmarks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/bookmarks
            Method: GET
        PutBookmark:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/bookmarks/{qid}
            Method: PUT
        DeleteBookmark:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/bookmarks/{qid}
            Method: DELETE

  HealthFunction:
    Type: AWS::Serverless::Function
    DependsOn: HealthLogGroup
    Properties:
      FunctionName: !Sub certstack-${Env}-health
      Description: Unauthenticated health check
      CodeUri: app/lambda/health/
      Handler: app.handler
      MemorySize: 128
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/health
            Method: GET
            Auth:
              Authorizer: NONE

  # ---------------------------------------------------------------- CDN
  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub certstack-${Env}-web-oac
        Description: OAC for the web bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ContentOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub certstack-${Env}-content-oac
        Description: OAC for the content bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub certstack-${Env}-security
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';
              script-src 'self'; connect-src 'self' https://*.amazonaws.com https://*.amazoncognito.com;
              base-uri 'self'; frame-ancestors 'none'
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub certstack-${Env}
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: content
            DomainName: !GetAtt ContentBucket.RegionalDomainName
            OriginAccessControlId: !Ref ContentOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Select [1, !Split ['://', !GetAtt HttpApi.ApiEndpoint]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: false
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
          - PathPattern: /content/index.json
            TargetOriginId: content
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          - PathPattern: /content/*
            TargetOriginId: content
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          - PathPattern: /config.json
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: false
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
      Tags:
        - Key: Project
          Value: CertStack
        - Key: Env
          Value: !Ref Env

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${WebBucket}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  ContentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ContentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${ContentBucket}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  AppUrl:
    Description: Open this URL in a browser
    Value: !Sub https://${Distribution.DomainName}
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  ApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TableName:
    Value: !Ref Table
  WebBucketName:
    Value: !Ref WebBucket
  ContentBucketName:
    Value: !Ref ContentBucket
